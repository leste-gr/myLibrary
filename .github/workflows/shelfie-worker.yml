name: Process shelfie queue

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/shelfie-worker.yml"
      - "worker/**"
      - "artifacts/spine-yolo.onnx"

concurrency:
  group: shelfie-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check for queued work
        id: queue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          response=$(curl --silent --show-error --fail \
            --get "$SUPABASE_URL/rest/v1/shelfie_uploads" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --data-urlencode "select=id" \
            --data-urlencode "status=in.(queued,processing)" \
            --data-urlencode "limit=1")
          if [ "$(jq 'length' <<<"$response")" -gt 0 ]; then
            echo "has_jobs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_jobs=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.queue.outputs.has_jobs == 'true'

      - name: Build cached worker image
        if: steps.queue.outputs.has_jobs == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          load: true
          tags: mylibrary-shelfie-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Drain queued shelfies
        if: steps.queue.outputs.has_jobs == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          docker run --rm \
            --env SUPABASE_URL \
            --env SUPABASE_SERVICE_ROLE_KEY \
            --env RUN_MODE=drain \
            --env WORKER_NAME=github-actions-${{ github.run_id }} \
            --env MAX_ATTEMPTS=3 \
            mylibrary-shelfie-worker:latest
