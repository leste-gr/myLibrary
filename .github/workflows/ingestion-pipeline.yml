name: Ingestion pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ingestion-pipeline.yml"
      - "scripts/process-pipeline.ts"
      - "lib/isbn-matcher.ts"
      - "lib/process-manual-import.ts"
      - "supabase/migrations/**"

concurrency:
  group: mylibrary-ingestion-pipeline
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run pipeline:process
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MYLIBRARY_SITE_URL: https://mylibrary-leste-gr.vercel.app

